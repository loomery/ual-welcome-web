name: Production Pipeline

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version to deploy (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: [self-hosted]
    environment: prod
    env:
      DXP_ACCESS_KEY: ${{ secrets.DXP_ACCESS_KEY }}
      DXP_TENANT_ID: ${{ secrets.DXP_TENANT_ID }}
      DXP_SERVER_URL: ${{ secrets.DXP_SERVER_URL }}
      DXP_FS_DIRECTORY: ${{ vars.DXP_FS_DIRECTORY }}
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22.22.0'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Compress
        run: npm run compress
      - name: Deploy to DXP
        run: node scripts/file-store.js
